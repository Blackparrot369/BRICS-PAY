[package]
name = "brics-crypto"
version = "0.1.0"
edition = "2021"
description = "Cryptographic primitives for BRICS Pay payment system"
license = "MIT"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
criterion = "0.5"
