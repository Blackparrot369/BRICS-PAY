[package]
name = "brics-api-rest"
version = "0.1.0"
edition = "2021"
description = "REST API for BRICS Pay payment system"
license = "MIT"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
brics-crypto = { path = "../../core/crypto" }
brics-ledger = { path = "../../core/ledger" }
